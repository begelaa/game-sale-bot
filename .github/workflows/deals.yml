
name: Daily Game Deals

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-sale-bot
  cancel-in-progress: false

jobs:
  check-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check game discounts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save sent deals history
        if: always()
        run: |
          if [ -f sent_deals.json ]; then
            git config user.name "game-sale-bot"
            git config user.email "game-sale-bot@users.noreply.github.com"
            git add sent_deals.json

            if ! git diff --cached --quiet; then
              git commit -m "Update sent deals history"
              git push
            fi
          fi
